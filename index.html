<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WineCard - Gestão de Garrafeira</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #root { width: 100%; height: 100%; font-size: 16px; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #1a1a1a; }
        
        .view { display: flex; flex-direction: column; height: 100vh; padding: 1rem; background: #f5f5f5; overflow-y: auto; }
        .view h1 { margin: 0 0 1.5rem 0; font-size: 24px; font-weight: 600; }
        .view h2 { margin: 0 0 1rem 0; font-size: 18px; font-weight: 500; }
        
        .btn { padding: 12px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; border: none; font-weight: 500; transition: all 0.2s; }
        .btn-primary { background: #378add; color: white; }
        .btn-primary:hover { background: #185fa5; }
        .btn-secondary { background: white; color: #1a1a1a; border: 0.5px solid #e0e0e0; }
        .btn-secondary:hover { background: #f5f5f5; }
        .btn-danger { background: #fce0e0; color: #e24b4a; border: 0.5px solid #f5b5b5; }
        .btn-full { width: 100%; margin-bottom: 12px; }
        
        .button-row { display: flex; gap: 12px; margin-top: 1rem; }
        .button-row .btn { flex: 1; margin-bottom: 0; }
        
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; font-weight: 500; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; font-size: 14px; border: 0.5px solid #e0e0e0; border-radius: 6px; font-family: inherit; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #378add; box-shadow: 0 0 0 3px rgba(55, 138, 221, 0.1); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1rem; }
        
        .camera-view { padding: 0; }
        .camera-container { flex: 1; display: flex; overflow: hidden; margin-bottom: 1rem; border-radius: 8px; }
        .camera-container video { width: 100%; height: 100%; object-fit: cover; }
        .camera-view .button-row { padding: 1rem; }
        
        .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 1.5rem; }
        .summary-card { background: white; border: 0.5px solid #e0e0e0; border-radius: 8px; padding: 1rem; text-align: center; }
        .summary-label { margin: 0 0 8px 0; font-size: 12px; color: #666; }
        .summary-value { margin: 0; font-size: 20px; font-weight: 600; }
        
        .filter-tabs { display: flex; gap: 8px; margin-bottom: 1.5rem; overflow-x: auto; }
        .filter-btn { padding: 8px 16px; border: 0.5px solid #e0e0e0; background: white; border-radius: 20px; font-size: 13px; cursor: pointer; white-space: nowrap; }
        .filter-btn.active { background: #378add; color: white; border-color: #378add; }
        
        .wine-item { background: white; border: 0.5px solid #e0e0e0; border-radius: 8px; padding: 1rem; margin-bottom: 12px; cursor: pointer; }
        .wine-name { font-weight: 600; margin: 0 0 4px 0; }
        .wine-region { font-size: 12px; color: #666; margin: 0 0 4px 0; }
        .wine-meta { font-size: 11px; color: #999; margin: 0; }
        .wine-type { font-size: 11px; background: #e6f1fb; color: #378add; padding: 4px 8px; border-radius: 4px; font-weight: 600; float: right; }
        
        .wine-card { background: white; border-radius: 12px; border: 0.5px solid #e0e0e0; padding: 1.5rem; margin-bottom: 1rem; }
        .wine-card h2 { margin: 0 0 0.5rem 0; }
        .wine-info-block { margin-bottom: 1rem; }
        .wine-info-label { font-size: 12px; color: #666; font-weight: 500; margin-bottom: 4px; }
        .wine-info-value { font-size: 14px; color: #1a1a1a; }
        
        .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .back-btn { background: none; border: none; color: #1a1a1a; cursor: pointer; font-size: 14px; padding: 0; margin-bottom: 1rem; }
        
        .star-rating { display: flex; gap: 8px; font-size: 20px; margin: 8px 0; }
        .star { cursor: pointer; opacity: 0.3; }
        .star.active { opacity: 1; }
        
        .preview-image { width: 100%; border-radius: 8px; max-height: 200px; object-fit: cover; margin-bottom: 1rem; }
        
        .alert { padding: 12px; border-radius: 6px; margin-bottom: 1rem; font-size: 13px; }
        .alert-info { background: #e6f1fb; color: #185fa5; border: 0.5px solid #b5d4f4; }
        .alert-success { background: #e8f5e9; color: #2e7d32; border: 0.5px solid #c8e6c9; }
        .alert-error { background: #fce0e0; color: #e24b4a; border: 0.5px solid #f5b5b5; }
        
        .loading { display: flex; align-items: center; justify-content: center; gap: 8px; color: #666; font-size: 14px; }
        .spinner { width: 16px; height: 16px; border: 2px solid #e0e0e0; border-top-color: #378add; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        canvas { display: none; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function WineCard() {
            const [wines, setWines] = useState([]);
            const [view, setView] = useState('cellar');
            const [selectedWine, setSelectedWine] = useState(null);
            const [editingWine, setEditingWine] = useState(null);
            const [newWine, setNewWine] = useState(null);
            const [cameraActive, setCameraActive] = useState(false);
            const [capturedImage, setCapturedImage] = useState(null);
            const [ocrText, setOcrText] = useState('');
            const [ocrLoading, setOcrLoading] = useState(false);
            const [filterType, setFilterType] = useState('all');
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const fileInputRef = useRef(null);

            useEffect(() => {
                const saved = localStorage.getItem('winecard_wines');
                if (saved) setWines(JSON.parse(saved));
            }, []);

            useEffect(() => {
                localStorage.setItem('winecard_wines', JSON.stringify(wines));
            }, [wines]);

            const startCamera = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                        setCameraActive(true);
                    }
                } catch (err) {
                    alert('Câmara não disponível.');
                }
            };

            const capturePhoto = () => {
                if (canvasRef.current && videoRef.current) {
                    const ctx = canvasRef.current.getContext('2d');
                    ctx.drawImage(videoRef.current, 0, 0);
                    const imageData = canvasRef.current.toDataURL('image/jpeg', 0.9);
                    setCapturedImage(imageData);
                    setCameraActive(false);
                    if (videoRef.current.srcObject) {
                        videoRef.current.srcObject.getTracks().forEach(t => t.stop());
                    }
                    setNewWine({
                        name: '',
                        year: new Date().getFullYear(),
                        region: '',
                        type: 'Tinto',
                        grapes: '',
                        temperature: '',
                        pairings: '',
                        aging: '',
                        vivinoRating: '',
                        myRating: 0,
                        notes: '',
                        quantity: 1,
                        purchaseYear: new Date().getFullYear()
                    });
                    performOCR(imageData);
                }
            };

            const performOCR = async (imageData) => {
                setOcrLoading(true);
                setOcrText('🔍 A ler rótulo com Google Vision...');
                
                try {
                    // PASSO 1: Google Vision extrai texto básico
                    const visionResponse = await fetch('/api/analyze-wine', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: imageData })
                    });

                    const visionResult = await visionResponse.json();

                    if (visionResult.success && visionResult.wineData) {
                        // Preenche dados básicos (nome, ano, tipo, região)
                        setNewWine(prev => ({
                            ...prev,
                            name: visionResult.wineData.name || prev.name,
                            year: visionResult.wineData.year || prev.year,
                            region: visionResult.wineData.region || prev.region,
                            type: visionResult.wineData.type || prev.type
                        }));

                        setOcrText(`✅ Detectado: ${visionResult.wineData.name} (${visionResult.wineData.year})`);

                        // PASSO 2: Claude extrai detalhes adicionais
                        if (visionResult.ocrText) {
                            setOcrText('🤖 Claude a analisar detalhes (castas, temperatura, etc)...');
                            
                            const claudeResponse = await fetch('/api/extract-wine-details', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ ocrText: visionResult.ocrText })
                            });

                            const claudeResult = await claudeResponse.json();

                            if (claudeResult.success && claudeResult.wineDetails) {
                                // Preenche campos adicionais (castas, temperatura, etc)
                                setNewWine(prev => ({
                                    ...prev,
                                    grapes: claudeResult.wineDetails.castas || prev.grapes,
                                    temperature: claudeResult.wineDetails.temperatura || prev.temperature,
                                    pairings: claudeResult.wineDetails.emparelhamento || prev.pairings,
                                    aging: claudeResult.wineDetails.guarda || prev.aging
                                }));
                                
                                setOcrText(`✅ ${visionResult.wineData.name} (${visionResult.wineData.year}) - Dados completos!`);
                            }
                        }
                    } else {
                        setOcrText('❌ Não consegui ler o rótulo. Preenche manualmente.');
                    }
                } catch (err) {
                    console.error('OCR error:', err);
                    setOcrText('❌ Erro ao processar. Tenta novamente.');
                }
                
                setOcrLoading(false);
            };

            const startNewWine = (withPhoto = false) => {
                setNewWine({
                    name: '',
                    year: new Date().getFullYear(),
                    region: '',
                    type: 'Tinto',
                    grapes: '',
                    temperature: '',
                    pairings: '',
                    aging: '',
                    vivinoRating: '',
                    myRating: 0,
                    notes: '',
                    quantity: 1,
                    purchaseYear: new Date().getFullYear()
                });
                if (!withPhoto) {
                    setCapturedImage(null);
                }
                setView('add');
            };

            const addWine = () => {
                if (!newWine?.name?.trim()) {
                    alert('Nome do vinho é obrigatório');
                    return;
                }
                const wine = {
                    id: Date.now(),
                    ...newWine,
                    photo: capturedImage,
                    dateAdded: new Date().toISOString()
                };
                setWines([wine, ...wines]);
                resetForm();
            };

            const updateWine = (id, data) => {
                setWines(wines.map(w => w.id === id ? { ...w, ...data } : w));
                setEditingWine(null);
                setSelectedWine(null);
            };

            const deleteWine = (id) => {
                if (confirm('Tens a certeza?')) {
                    setWines(wines.filter(w => w.id !== id));
                    setSelectedWine(null);
                }
            };

            const resetForm = () => {
                setNewWine(null);
                setCapturedImage(null);
                setOcrText('');
                setView('cellar');
            };

            const filteredWines = filterType === 'all' ? wines : wines.filter(w => w.type === filterType);
            const tintos = wines.filter(w => w.type === 'Tinto').length;
            const brancos = wines.filter(w => w.type === 'Branco').length;
            const roses = wines.filter(w => w.type === 'Rosé').length;

            // Camera view
            if (cameraActive) {
                return (
                    <div className="view camera-view">
                        <div className="camera-container">
                            <video ref={videoRef} autoPlay playsInline />
                            <canvas ref={canvasRef} width={640} height={480} />
                        </div>
                        <div className="button-row">
                            <button className="btn btn-secondary" onClick={() => { setCameraActive(false); if (videoRef.current?.srcObject) videoRef.current.srcObject.getTracks().forEach(t => t.stop()); }}>Cancelar</button>
                            <button className="btn btn-primary" onClick={capturePhoto}>Fotografar</button>
                        </div>
                        {capturedImage && (
                            <div className="button-row">
                                <button className="btn btn-secondary" onClick={() => setCapturedImage(null)}>Outra foto</button>
                                <button className="btn btn-primary" onClick={() => startNewWine(true)}>Usar esta foto</button>
                            </div>
                        )}
                    </div>
                );
            }

            // Edit view
            if (editingWine) {
                return (
                    <div className="view">
                        <button className="back-btn" onClick={() => setEditingWine(null)}>← Voltar</button>
                        <h2>Editar vinho</h2>
                        
                        {editingWine.photo && <img src={editingWine.photo} className="preview-image" />}

                        <div className="form-group">
                            <label>Nome do vinho *</label>
                            <input type="text" value={editingWine.name || ''} onChange={e => setEditingWine({...editingWine, name: e.target.value})} />
                        </div>

                        <div className="form-row">
                            <div className="form-group">
                                <label>Ano</label>
                                <input type="number" value={editingWine.year || ''} onChange={e => setEditingWine({...editingWine, year: e.target.value})} />
                            </div>
                            <div className="form-group">
                                <label>Tipo</label>
                                <select value={editingWine.type || 'Tinto'} onChange={e => setEditingWine({...editingWine, type: e.target.value})}>
                                    <option>Tinto</option>
                                    <option>Branco</option>
                                    <option>Rosé</option>
                                </select>
                            </div>
                        </div>

                        <div className="form-group">
                            <label>Região</label>
                            <input type="text" value={editingWine.region || ''} onChange={e => setEditingWine({...editingWine, region: e.target.value})} placeholder="ex: Douro" />
                        </div>

                        <div className="form-group">
                            <label>Castas</label>
                            <input type="text" value={editingWine.grapes || ''} onChange={e => setEditingWine({...editingWine, grapes: e.target.value})} />
                        </div>

                        <div className="form-group">
                            <label>Temperatura (°C)</label>
                            <input type="text" value={editingWine.temperature || ''} onChange={e => setEditingWine({...editingWine, temperature: e.target.value})} placeholder="ex: 14-16" />
                        </div>

                        <div className="form-group">
                            <label>Emparelhamento com comida</label>
                            <textarea value={editingWine.pairings || ''} onChange={e => setEditingWine({...editingWine, pairings: e.target.value})} style={{minHeight: '50px'}} />
                        </div>

                        <div className="form-group">
                            <label>Potencial de guarda</label>
                            <input type="text" value={editingWine.aging || ''} onChange={e => setEditingWine({...editingWine, aging: e.target.value})} placeholder="ex: Até 2030" />
                        </div>

                        <div className="form-group">
                            <label>Avaliação Vivino</label>
                            <input type="number" step="0.1" min="0" max="5" value={editingWine.vivinoRating || ''} onChange={e => setEditingWine({...editingWine, vivinoRating: e.target.value})} />
                        </div>

                        <div className="form-group">
                            <label>Minha avaliação</label>
                            <div className="star-rating">
                                {[1,2,3,4,5].map(i => (
                                    <span key={i} className={`star ${i <= (editingWine.myRating || 0) ? 'active' : ''}`} onClick={() => setEditingWine({...editingWine, myRating: i})}>⭐</span>
                                ))}
                            </div>
                        </div>

                        <div className="form-group">
                            <label>Observações</label>
                            <textarea value={editingWine.notes || ''} onChange={e => setEditingWine({...editingWine, notes: e.target.value})} style={{minHeight: '50px'}} />
                        </div>

                        <div className="form-group">
                            <label>Quantidade</label>
                            <input type="number" min="1" value={editingWine.quantity || 1} onChange={e => setEditingWine({...editingWine, quantity: parseInt(e.target.value) || 1})} />
                        </div>

                        <div className="button-row">
                            <button className="btn btn-secondary" onClick={() => setEditingWine(null)}>Cancelar</button>
                            <button className="btn btn-primary" onClick={() => updateWine(editingWine.id, editingWine)}>Guardar</button>
                        </div>
                    </div>
                );
            }

            // Detail view
            if (selectedWine) {
                return (
                    <div className="view">
                        <button className="back-btn" onClick={() => setSelectedWine(null)}>← Voltar</button>
                        
                        {selectedWine.photo && <img src={selectedWine.photo} className="preview-image" />}

                        <div className="wine-card">
                            <h2>{selectedWine.name}</h2>
                            <p style={{margin: '0 0 1rem 0', fontSize: '13px', color: '#666'}}>{selectedWine.region && selectedWine.region + ' · '}{selectedWine.year}</p>
                            
                            <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', marginBottom: '1rem'}}>
                                <div className="wine-info-block">
                                    <p className="wine-info-label">Tipo</p>
                                    <p className="wine-info-value">{selectedWine.type}</p>
                                </div>
                                {selectedWine.temperature && <div className="wine-info-block">
                                    <p className="wine-info-label">Temperatura</p>
                                    <p className="wine-info-value">{selectedWine.temperature}°C</p>
                                </div>}
                            </div>

                            {selectedWine.grapes && <div className="wine-info-block">
                                <p className="wine-info-label">Castas</p>
                                <p className="wine-info-value">{selectedWine.grapes}</p>
                            </div>}

                            {selectedWine.pairings && <div className="wine-info-block">
                                <p className="wine-info-label">Emparelhamentos</p>
                                <p className="wine-info-value">{selectedWine.pairings}</p>
                            </div>}

                            {selectedWine.aging && <div className="wine-info-block">
                                <p className="wine-info-label">Potencial de guarda</p>
                                <p className="wine-info-value">{selectedWine.aging}</p>
                            </div>}

                            {selectedWine.vivinoRating && <div className="wine-info-block">
                                <p className="wine-info-label">Vivino</p>
                                <p className="wine-info-value">{selectedWine.vivinoRating}/5</p>
                            </div>}

                            {selectedWine.myRating > 0 && <div className="wine-info-block">
                                <p className="wine-info-label">Minha avaliação</p>
                                <p className="wine-info-value">{'⭐'.repeat(selectedWine.myRating)}</p>
                            </div>}

                            {selectedWine.notes && <div className="wine-info-block">
                                <p className="wine-info-label">Observações</p>
                                <p className="wine-info-value">{selectedWine.notes}</p>
                            </div>}
                        </div>

                        <div className="button-row">
                            <button className="btn btn-secondary" onClick={() => setEditingWine(selectedWine)}>Editar</button>
                            <button className="btn btn-danger" onClick={() => deleteWine(selectedWine.id)}>Eliminar</button>
                        </div>
                    </div>
                );
            }

            // Add wine view
            if (view === 'add') {
                return (
                    <div className="view">
                        <button className="back-btn" onClick={resetForm}>← Voltar</button>
                        <h2>Adicionar vinho</h2>

                        {!newWine && (
                            <>
                                <p style={{marginBottom: '1rem', color: '#666', fontSize: '14px'}}>Fotografa o rótulo (OCR + Claude)</p>
                                <button className="btn btn-primary btn-full" onClick={startCamera}>📷 Fotografar</button>
                                <button className="btn btn-secondary btn-full" onClick={() => fileInputRef.current?.click()}>📁 Upload foto</button>
                                <input ref={fileInputRef} type="file" accept="image/*" onChange={e => {
                                    const file = e.target.files?.[0];
                                    if (file) {
                                        const reader = new FileReader();
                                        reader.onload = (evt) => {
                                            setCapturedImage(evt.target?.result);
                                            setNewWine({
                                                name: '',
                                                year: new Date().getFullYear(),
                                                region: '',
                                                type: 'Tinto',
                                                grapes: '',
                                                temperature: '',
                                                pairings: '',
                                                aging: '',
                                                vivinoRating: '',
                                                myRating: 0,
                                                notes: '',
                                                quantity: 1,
                                                purchaseYear: new Date().getFullYear()
                                            });
                                            performOCR(evt.target?.result);
                                        };
                                        reader.readAsDataURL(file);
                                    }
                                }} />
                                <p style={{marginTop: '2rem', fontSize: '13px', color: '#999', textAlign: 'center'}}>Ou preenche sem foto</p>
                                <button className="btn btn-secondary btn-full" onClick={() => startNewWine(false)}>✏️ Sem foto</button>
                            </>
                        )}

                        {newWine && (
                            <>
                                {capturedImage && <img src={capturedImage} className="preview-image" />}

                                {ocrLoading && (
                                    <div className="alert alert-info">
                                        <div className="loading">
                                            <div className="spinner"></div>
                                            {ocrText}
                                        </div>
                                    </div>
                                )}
                                
                                {ocrText && !ocrLoading && (
                                    <div className={`alert ${ocrText.includes('✅') ? 'alert-success' : ocrText.includes('⚠️') ? 'alert-info' : 'alert-error'}`}>
                                        {ocrText}
                                    </div>
                                )}

                                <div className="form-group">
                                    <label>Nome do vinho *</label>
                                    <input type="text" value={newWine.name || ''} onChange={e => setNewWine({...newWine, name: e.target.value})} placeholder="ex: Monte Meão" autoFocus />
                                </div>

                                <div className="form-row">
                                    <div className="form-group">
                                        <label>Ano</label>
                                        <input type="number" value={newWine.year || ''} onChange={e => setNewWine({...newWine, year: parseInt(e.target.value) || 0})} placeholder="2014" />
                                    </div>
                                    <div className="form-group">
                                        <label>Tipo</label>
                                        <select value={newWine.type} onChange={e => setNewWine({...newWine, type: e.target.value})}>
                                            <option>Tinto</option>
                                            <option>Branco</option>
                                            <option>Rosé</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="form-group">
                                    <label>Região</label>
                                    <input type="text" value={newWine.region || ''} onChange={e => setNewWine({...newWine, region: e.target.value})} placeholder="ex: Douro" />
                                </div>

                                <div className="form-group">
                                    <label>Castas</label>
                                    <input type="text" value={newWine.grapes || ''} onChange={e => setNewWine({...newWine, grapes: e.target.value})} />
                                </div>

                                <div className="form-group">
                                    <label>Temperatura (°C)</label>
                                    <input type="text" value={newWine.temperature || ''} onChange={e => setNewWine({...newWine, temperature: e.target.value})} placeholder="14-16°C" />
                                </div>

                                <div className="form-group">
                                    <label>Emparelhamento com comida</label>
                                    <textarea value={newWine.pairings || ''} onChange={e => setNewWine({...newWine, pairings: e.target.value})} style={{minHeight: '50px'}} />
                                </div>

                                <div className="form-group">
                                    <label>Potencial de guarda</label>
                                    <input type="text" value={newWine.aging || ''} onChange={e => setNewWine({...newWine, aging: e.target.value})} placeholder="ex: Até 2030" />
                                </div>

                                <div className="form-group">
                                    <label>Avaliação Vivino</label>
                                    <input type="number" step="0.1" min="0" max="5" value={newWine.vivinoRating || ''} onChange={e => setNewWine({...newWine, vivinoRating: e.target.value})} />
                                </div>

                                <div className="form-group">
                                    <label>Minha avaliação</label>
                                    <div className="star-rating">
                                        {[1,2,3,4,5].map(i => (
                                            <span key={i} className={`star ${i <= (newWine.myRating || 0) ? 'active' : ''}`} onClick={() => setNewWine({...newWine, myRating: i})}>⭐</span>
                                        ))}
                                    </div>
                                </div>

                                <div className="form-group">
                                    <label>Observações</label>
                                    <textarea value={newWine.notes || ''} onChange={e => setNewWine({...newWine, notes: e.target.value})} style={{minHeight: '50px'}} />
                                </div>

                                <div className="form-group">
                                    <label>Quantidade</label>
                                    <input type="number" min="1" value={newWine.quantity || 1} onChange={e => setNewWine({...newWine, quantity: parseInt(e.target.value) || 1})} />
                                </div>

                                <div className="button-row">
                                    <button className="btn btn-secondary" onClick={() => {setCapturedImage(null); setNewWine(null);}}>Voltar</button>
                                    <button className="btn btn-primary" onClick={addWine}>Adicionar</button>
                                </div>
                            </>
                        )}
                    </div>
                );
            }

            // Cellar view
            return (
                <div className="view">
                    <h1>🍷 WineCard</h1>

                    {wines.length > 0 ? (
                        <>
                            <div className="summary-grid">
                                <div className="summary-card">
                                    <p className="summary-label">Tintos</p>
                                    <p className="summary-value">{tintos}</p>
                                </div>
                                <div className="summary-card">
                                    <p className="summary-label">Brancos</p>
                                    <p className="summary-value">{brancos}</p>
                                </div>
                                <div className="summary-card">
                                    <p className="summary-label">Rosés</p>
                                    <p className="summary-value">{roses}</p>
                                </div>
                            </div>

                            <div className="filter-tabs">
                                <button className={`filter-btn ${filterType === 'all' ? 'active' : ''}`} onClick={() => setFilterType('all')}>Todos ({wines.length})</button>
                                <button className={`filter-btn ${filterType === 'Tinto' ? 'active' : ''}`} onClick={() => setFilterType('Tinto')}>Tintos ({tintos})</button>
                                <button className={`filter-btn ${filterType === 'Branco' ? 'active' : ''}`} onClick={() => setFilterType('Branco')}>Brancos ({brancos})</button>
                                <button className={`filter-btn ${filterType === 'Rosé' ? 'active' : ''}`} onClick={() => setFilterType('Rosé')}>Rosés ({roses})</button>
                            </div>

                            <div style={{flex: 1, overflowY: 'auto', marginBottom: '1rem'}}>
                                {filteredWines.map(wine => (
                                    <div key={wine.id} className="wine-item" onClick={() => setSelectedWine(wine)}>
                                        <span className="wine-type">{wine.type}</span>
                                        <p className="wine-name">{wine.name}</p>
                                        <p className="wine-region">{wine.region && wine.region + ' · '}{wine.year}</p>
                                        <p className="wine-meta">Qtd: {wine.quantity}</p>
                                    </div>
                                ))}
                            </div>
                        </>
                    ) : (
                        <div className="empty-state">
                            <p>Nenhum vinho na garrafeira</p>
                        </div>
                    )}

                    <button className="btn btn-primary btn-full" onClick={() => setView('add')}>+ Adicionar vinho</button>
                </div>
            );
        }

        ReactDOM.render(<WineCard />, document.getElementById('root'));
    </script>
</body>
</html>
